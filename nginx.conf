# ---------------------------------------------------------------------------
# nginx site file for coffeebot.doting.ir (Debian/Ubuntu layout)
#
# This file is included INSIDE the http {} block of /etc/nginx/nginx.conf
# (via sites-enabled), so it may only contain http-level directives:
# upstream / server / limit_req_zone / ... — no "user", "events" or "http".
#
# Deploy:
#   sudo cp nginx.conf /etc/nginx/sites-available/coffeebot.doting.ir
#   sudo ln -sf /etc/nginx/sites-available/coffeebot.doting.ir /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate (Let's Encrypt):
#   sudo certbot certonly --webroot -w /var/www/certbot -d coffeebot.doting.ir
#
# Matching .env values:
#   APP_BASE_URL=https://coffeebot.doting.ir
#   TRUSTED_PROXIES=172.28.0.1
#     (the app sees nginx's connection coming from the docker bridge
#      gateway IP — adjust if your subnet differs)
#   TRUST_PROXY=1
#     (alternative to TRUSTED_PROXIES: trust exactly N proxy hops. Use ONE of
#      the two, not both. TRUSTED_PROXIES is preferred because it stays
#      spoof-proof even if the number of hops changes.)
# ---------------------------------------------------------------------------

# 172.28.0.10 must be a STATIC container IP (compose "ipv4_address" or
# docker network --subnet + fixed IP), otherwise it changes on restart and
# nginx starts proxying into the void.
upstream coffeebot {
    server 172.28.0.10:3000;
    keepalive 32;
}

# Zone names must be unique across ALL site files (shared memory is global
# in nginx) — avoid collisions with mah-asall.com and other sites.
#
# Rate limiting at nginx is DISABLED ENTIRELY (was the source of spurious 429s
# in production). No limit_req_zone / limit_req / limit_req_status directives
# exist in this file — nginx can never answer 429. The app keeps its own
# per-IP limiter, which resolves real client IPs via X-Forwarded-For
# (TRUSTED_PROXIES in .env).

# --- CORS -------------------------------------------------------------------
# The Mini App is served from this same origin, so CORS is not strictly
# required. It IS required when the panel is opened from web.telegram.org
# (Telegram Web renders Mini Apps inside an iframe) or from a local dev server.
# Only these exact origins are echoed back — never "*", because the API is
# credentialed and a wildcard would let any site read admin responses.
map $http_origin $coffeebot_cors_origin {
    default                            "";
    "https://coffeebot.doting.ir"      $http_origin;
    "https://web.telegram.org"         $http_origin;
    "https://webk.telegram.org"        $http_origin;
    "https://webz.telegram.org"        $http_origin;
    "~^http://localhost(:\d+)?$"       $http_origin;
    "~^http://127\.0\.0\.1(:\d+)?$"    $http_origin;
}

# --- HTTP -> HTTPS ----------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name coffeebot.doting.ir;

    access_log /var/log/nginx/coffeebot.access.log;
    error_log  /var/log/nginx/coffeebot.error.log warn;

    # The ACME challenge must stay reachable over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 308 (Permanent Redirect) preserves the request METHOD and, per fetch
    # spec, lets the browser re-attach request headers on the redirected
    # request. 301/302 rewrite POST->GET and custom headers (e.g.
    # x-telegram-init-data) are dropped on the second hop.
    location / {
        return 308 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    # nginx >= 1.25.1 syntax (the old "listen ... http2" form is deprecated).
    http2       on;
    server_name coffeebot.doting.ir;

    access_log /var/log/nginx/coffeebot.access.log;
    error_log  /var/log/nginx/coffeebot.error.log warn;

    server_tokens off;

    # --- Telegram Mini App requirements -------------------------------------
    # initData is a URL-encoded query string that grows past 4 KB once the user
    # object, photo_url and query_id are included. With the default 8k header
    # buffer nginx answers 400/431 and the app then reports "missing
    # x-telegram-init-data header" — the single most common cause of that error.
    client_header_buffer_size 16k;
    large_client_header_buffers 4 64k;
    # nginx silently DROPS headers containing underscores unless this is on.
    # Our header uses hyphens, but Telegram's tooling and some upstream proxies
    # emit underscore-prefixed headers — keep them instead of losing them.
    underscores_in_headers on;

    # Product images are uploaded as base64 JSON (~2.7 MB for a 2 MB image);
    # the app accepts up to 4 MB. The default 1m would return 413.
    client_max_body_size 8m;

    # --- TLS ----------------------------------------------------------------
    ssl_certificate         /etc/letsencrypt/live/coffeebot.doting.ir/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/coffeebot.doting.ir/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/coffeebot.doting.ir/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    # Zone name must be unique across ALL site files (shared memory is global
    # in nginx) — "SSL" already exists in mah-asall.com.
    ssl_session_cache   shared:coffeebot_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # No ssl_stapling: Let's Encrypt ended OCSP — current certs carry no OCSP
    # responder URL, so stapling is ignored and only logs a warning on reload.
    resolver        1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- gzip ---------------------------------------------------------------
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/manifest+json image/svg+xml;

    # --- proxying -----------------------------------------------------------
    # X-Forwarded-For MUST be APPENDED ($proxy_add_x_forwarded_for), never
    # overwritten with $remote_addr. Overwriting makes every request look like
    # it came from the Docker bridge gateway (172.28.0.1), so the app's per-IP
    # rate limiter puts ALL users in one bucket and returns 429 "too many
    # requests" as soon as a handful of people open the Mini App.
    #
    # Spoofing is still impossible: the app walks XFF from the RIGHT and skips
    # trusted proxy addresses (TRUSTED_PROXIES=172.28.0.1), so a client-supplied
    # "X-Forwarded-For: 1.2.3.4" is ignored — the rightmost untrusted entry is
    # the address nginx itself appended.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_set_header Connection        "";

    # Pass Telegram's signed initData through explicitly. nginx forwards unknown
    # headers by default, but being explicit documents the contract and survives
    # future `proxy_pass_request_headers off` / header-filter changes.
    proxy_set_header x-telegram-init-data $http_x_telegram_init_data;

    # The app sets its own CSP (frame-ancestors) and deliberately does NOT send
    # X-Frame-Options, because Telegram Web renders Mini Apps inside an iframe.
    # Strip it defensively in case an upstream or an older build adds it back.
    proxy_hide_header X-Frame-Options;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;
    proxy_redirect off;

    # Health probe is unauthenticated — keep it out of the access log.
    location ~ ^/healthz?$ {
        access_log off;
        proxy_pass http://coffeebot;
    }

    # Admin API: nginx-level rate limiting is disabled entirely (see the
    # limit_req_zone note above) — nginx never emits 429.
    location /api/ {
        # Declaring ANY proxy_set_header in a location makes nginx DROP every
        # server-level one, so the full set is repeated here. The initData
        # header is passed explicitly — it is the whole auth contract.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";
        proxy_set_header x-telegram-init-data $http_x_telegram_init_data;

        # CORS preflight. The browser sends OPTIONS before any request carrying
        # the custom x-telegram-init-data header, and nginx must answer it (the
        # app has no OPTIONS routes). Both spellings of the initData header are
        # listed because some clients normalize custom headers differently.
        add_header Access-Control-Allow-Origin  $coffeebot_cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-telegram-init-data, X-Telegram-Init-Data" always;
        add_header Access-Control-Max-Age       86400 always;
        add_header Vary                         Origin always;
        # add_header in a location REPLACES the server-level set, so HSTS has to
        # be repeated here or it is silently dropped on API responses.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $coffeebot_cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, x-telegram-init-data, X-Telegram-Init-Data" always;
            add_header Access-Control-Max-Age       86400 always;
            add_header Vary                         Origin always;
            return 204;
        }

        proxy_pass http://coffeebot;
    }

    # Product images served from the data volume.
    location /uploads/ {
        proxy_pass http://coffeebot;
    }

    # Mini App static assets + SPA fallback.
    location / {
        # Full set repeated: any proxy_set_header here cancels the inherited
        # server-level ones. The panel's own fetch() calls are same-origin
        # relative paths, but a misconfigured base URL could land here — keep
        # the initData header flowing regardless.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Connection        "";
        proxy_set_header x-telegram-init-data $http_x_telegram_init_data;

        proxy_pass http://coffeebot;
    }
}
