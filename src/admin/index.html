<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>مدیریت کافه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/admin.css" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <header class="appbar">
    <h1 id="appbar-title">سفارش‌ها</h1>
    <div class="appbar-actions">
      <button id="btn-create" class="icon-btn" type="button" hidden aria-label="افزودن"></button>
      <button id="btn-refresh" class="icon-btn" type="button" aria-label="به‌روزرسانی"></button>
    </div>
  </header>

  <main id="main">
    <section id="page-reports" class="page" aria-label="سفارش‌ها"></section>
    <section id="page-products" class="page" hidden aria-label="محصولات"></section>
    <section id="page-customers" class="page" hidden aria-label="مشتریان"></section>
    <section id="page-settings" class="page" hidden aria-label="تنظیمات"></section>
  </main>

  <nav class="bottomnav" aria-label="ناوبری اصلی">
    <button class="nav-item active" data-page="reports" type="button"></button>
    <button class="nav-item" data-page="products" type="button"></button>
    <button class="nav-item" data-page="customers" type="button"></button>
    <button class="nav-item" data-page="settings" type="button"></button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <div id="sheet-root" class="sheet-root" hidden>
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip"></div>
      <header class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button id="sheet-close" class="icon-btn" type="button" aria-label="بستن"></button>
      </header>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/reports.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/customers.js"></script>
  <script src="/js/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
